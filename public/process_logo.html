<!DOCTYPE html>
<html>
<head>
  <title>Logo BG Remover</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
  </style>
</head>
<body>
  <h3>Processing Image...</h3>
  <canvas id="canvas" style="display:none;"></canvas>
  <script>
    const img = new Image();
    img.src = "/temp_uploaded.png";
    img.onload = () => {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      let minX = canvas.width;
      let minY = canvas.height;
      let maxX = 0;
      let maxY = 0;
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        
        // If near white, make transparent
        if (r > 245 && g > 245 && b > 245) {
          data[i+3] = 0;
        } else {
          const pixelIdx = i / 4;
          const x = pixelIdx % canvas.width;
          const y = Math.floor(pixelIdx / canvas.width);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
      
      ctx.putImageData(imgData, 0, 0);
      
      // Crop the canvas to the bounding box
      const cropW = (maxX - minX) + 1;
      const cropH = (maxY - minY) + 1;
      
      const croppedCanvas = document.createElement("canvas");
      croppedCanvas.width = cropW;
      croppedCanvas.height = cropH;
      const croppedCtx = croppedCanvas.getContext("2d");
      
      croppedCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
      
      const dataUrl = croppedCanvas.toDataURL("image/png");
      
      const resultDiv = document.createElement("div");
      resultDiv.id = "result-url";
      resultDiv.innerText = dataUrl;
      document.body.appendChild(resultDiv);
      
      const status = document.createElement("h3");
      status.id = "status";
      status.innerText = "Done!";
      document.body.appendChild(status);
    };
  </script>
</body>
</html>
